<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP 艺术史 · 古代地中海与埃及</title>
  <style>
    :root {
      color-scheme:light;
      --ink:#211f1c;
      --ink-soft:#6b6558;
      --ink-faint:#9b9382;
      --paper:#f9f4e8;
      --card:#fffdf8;
      --surface-sunken:#f2e9d8;
      --line:#e7dcc6;
      --line-strong:#d8c9a8;
      --accent:#8b1a1a;
      --egypt:#b85d44;
      --greece:#597f8b;
      --rome:#c8943d;
    }
    * { box-sizing: border-box; }
    html, body {
      font-family:"PingFang SC", "Hiragino Sans GB", -apple-system, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    body { margin:0; min-width:0; color:var(--ink); background:var(--paper); }
    .page-header { max-width:1180px; margin:auto; padding:28px 20px 14px; }
    .page-header h1 { margin:0 0 6px; font-size:19px; font-weight:800; letter-spacing:-.01em; }
    .subtitle { margin:0; color:var(--ink-soft); font-size:12px; line-height:1.6; }
    .filter-toolbar { max-width:1180px; margin:0 auto 16px; padding:0 20px; display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
    .civilization-filters { display:flex; flex-wrap:wrap; gap:7px; }
    .filter-label { display:grid; gap:4px; font-size:.82rem; color:var(--ink-soft); }
    button, select, input { font:inherit; }
    .filter-pill, .clear-button { border:1px solid var(--line); border-radius:999px; padding:9px 14px; color:var(--ink); background:var(--card); cursor:pointer; }
    .filter-pill[aria-pressed="true"] { color:#fff; background:#4d463e; border-color:#4d463e; }
    select, input[type="search"] { min-height:40px; max-width:100%; border:1px solid var(--line); border-radius:10px; padding:7px 10px; color:var(--ink); background:var(--card); }
    #searchInput { width:min(260px,100%); }
    :focus-visible { outline:3px solid #28708a; outline-offset:3px; }
    .art-workspace { width:calc(100% - 40px); max-width:1180px; height:min(620px,78vh); min-height:480px; margin:0 auto 28px; display:grid; grid-template-columns:minmax(0,2fr) minmax(275px,1fr); overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--card); box-shadow:0 14px 36px rgba(74,57,38,.11); }
    .map-panel { position:relative; min-width:0; overflow:hidden; background:#f0e6d6; }
    .map-svg { display:block; width:100%; height:100%; }
    #panSurface { touch-action:none; }
    .world-geography { pointer-events:none; }
    .marker-layer { pointer-events:none; }
    .marker-leader { stroke:#8c7d68; stroke-width:2.5; stroke-linecap:round; opacity:.72; vector-effect:non-scaling-stroke; pointer-events:none; }
    .site-marker { pointer-events:all; cursor:pointer; }
    .site-marker .marker-hit-area { fill:transparent; pointer-events:all; }
    .site-marker .marker-visual { transform-box:fill-box; transform-origin:center; transition:transform .15s ease; pointer-events:none; }
    .site-marker.is-active .marker-visual { transform:scale(1.08); }
    .site-marker .marker-label-bg { stroke:#fff; stroke-width:5; filter:drop-shadow(0 3px 4px rgba(40,30,20,.42)); transition:stroke-width .15s ease,filter .15s ease; }
    .site-marker.is-active .marker-label-bg { stroke-width:8; filter:drop-shadow(0 4px 7px rgba(40,30,20,.55)); }
    .site-marker .marker-ap-label { fill:#fff; font-weight:700; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
    .site-marker[data-civilization="egypt"] .marker-label-bg { fill:var(--egypt); }
    .site-marker[data-civilization="greece"] .marker-label-bg { fill:var(--greece); }
    .site-marker[data-civilization="rome"] .marker-label-bg { fill:var(--rome); }
    .site-marker[data-civilization="mixed"] .marker-label-bg { fill:var(--greece); stroke:var(--rome); stroke-width:9; }
    .expanded-pin-leader { stroke:#665b4c; stroke-width:2; stroke-linecap:round; opacity:.78; vector-effect:non-scaling-stroke; pointer-events:none; }
    .expanded-work-pin { pointer-events:all; cursor:pointer; }
    .expanded-work-pin .expanded-pin-hit-area { fill:transparent; pointer-events:all; }
    .expanded-work-pin .expanded-pin-visual { transform-box:fill-box; transform-origin:center; transition:transform .15s ease; pointer-events:none; }
    .expanded-work-pin .expanded-pin-bg { stroke:#fff; stroke-width:5; filter:drop-shadow(0 3px 4px rgba(40,30,20,.42)); vector-effect:non-scaling-stroke; }
    .expanded-work-pin .expanded-pin-label { fill:#fff; font-weight:800; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
    .expanded-work-pin[data-civilization="egypt"] .expanded-pin-bg { fill:var(--egypt); }
    .expanded-work-pin[data-civilization="greece"] .expanded-pin-bg { fill:var(--greece); }
    .expanded-work-pin[data-civilization="rome"] .expanded-pin-bg { fill:var(--rome); }
    .expanded-work-pin.is-active .expanded-pin-visual { transform:scale(1.12); }
    .expanded-work-pin.is-active .expanded-pin-bg { stroke:#211f1c; stroke-width:8; }
    .expanded-pin-list { display:none; width:100%; }
    .expanded-pin-list.is-visible { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; padding:10px; border-top:1px solid var(--line); background:#fffaf2; }
    .map-panel.has-compact-list { display:grid; grid-template-rows:minmax(260px,1fr) auto; overflow:auto; }
    .map-panel.has-compact-list .map-svg { grid-row:1; min-height:260px; }
    .expanded-pin-list-button { min-height:44px; padding:9px 10px; border:2px solid transparent; border-radius:10px; color:#fff; background:#4d463e; font-weight:800; text-align:left; overflow-wrap:anywhere; cursor:pointer; }
    .expanded-pin-list-button[data-civilization="egypt"] { background:var(--egypt); }
    .expanded-pin-list-button[data-civilization="greece"] { background:var(--greece); }
    .expanded-pin-list-button[data-civilization="rome"] { background:var(--rome); }
    .expanded-pin-list-button.is-active { border-color:#211f1c; box-shadow:0 0 0 3px #fff inset; }
    .map-controls { position:absolute; z-index:2; top:12px; right:12px; display:flex; gap:6px; padding:6px; border:1px solid var(--line); border-radius:12px; background:rgba(255,250,240,.94); box-shadow:0 3px 12px rgba(48,42,36,.12); }
    .map-controls button, .site-cycle button { min-width:40px; min-height:40px; border:1px solid var(--line); border-radius:9px; background:#fffaf0; color:var(--ink); cursor:pointer; }
    .map-controls .overview-button { padding:0 10px; }
    .selected-summary { display:grid; gap:10px; }
    .selected-summary h2, .selected-summary p { margin:0; }
    .work-title-en { margin:0; font-size:22px; line-height:1.2; font-weight:800; letter-spacing:-.01em; }
    .work-title-zh { margin:0; font-size:14px; line-height:1.5; font-weight:600; color:var(--ink-soft); }
    .selected-summary .work-meta { color:var(--ink-soft); line-height:1.55; }
    .work-meta { font-size:12px; font-weight:600; }
    .artwork-image-button { display:grid; place-items:center; box-sizing:border-box; width:100%; height:300px; max-height:300px; padding:10px; overflow:hidden; border:1px solid var(--line-strong); border-radius:10px; background:var(--surface-sunken); cursor:zoom-in; }
    .artwork-image-button img { display:block; width:100%; height:278px; max-width:100%; max-height:278px; object-fit:contain; object-position:center; }
    .image-fallback { min-height:150px; display:grid; place-items:center; padding:20px; color:var(--ink-soft); background:linear-gradient(135deg,#eadfce,#f8f0e5); text-align:center; }
    .identity-list { display:grid; gap:6px; margin:0; }
    .identity-row { display:grid; grid-template-columns:5.3em minmax(0,1fr); gap:8px; line-height:1.5; }
    .identity-row dt { color:var(--ink-soft); }
    .identity-row dd { margin:0; }
    .detail-tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-top:5px; border-bottom:1px solid var(--line); }
    .detail-tab { min-height:40px; padding:7px 4px; border:0; border-radius:8px 8px 0 0; color:var(--ink-soft); background:transparent; cursor:pointer; }
    .detail-tab[aria-selected="true"] { color:var(--ink); background:#eee2cf; font-weight:700; box-shadow:inset 0 -3px #8a5c39; }
    .detail-tabpanel { display:grid; gap:12px; padding:14px 0 2px; line-height:1.65; }
    .detail-tabpanel h3, .detail-tabpanel p, .detail-tabpanel ul { margin:0; }
    .study-block { display:grid; gap:5px; }
    .study-block h3 { font-size:.92rem; color:#765438; }
    .anchor-list { padding-left:1.25em; }
    .comparison-grid { display:grid; gap:8px; }
    .comparison-card { display:grid; gap:3px; width:100%; padding:11px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:#fffaf0; text-align:left; cursor:pointer; }
    .comparison-card strong { font-size:.95rem; }
    .comparison-card span { color:var(--ink-soft); font-size:.82rem; }
    .comparison-card .comparison-angle { color:var(--ink); font-size:.84rem; line-height:1.55; }
    .image-credit { color:var(--ink-soft); font-size:.78rem; line-height:1.5; }
    .image-credit a, .dialog-license { color:#765438; }
    .site-cycle { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .detail-panel { min-width:0; overflow:auto; padding:22px; border-left:1px solid var(--line); background:#fffaf2; }
    .result-count { margin:0 0 16px; color:var(--ink-soft); font-size:12px; font-weight:700; }
    .instruction, .empty-state { min-height:200px; display:grid; align-content:center; gap:12px; }
    .instruction h2, .empty-state h2 { margin:0; font-size:1.25rem; }
    .instruction p, .empty-state p { margin:0; color:var(--ink-soft); line-height:1.65; }
    .legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:24px; font-size:.86rem; }
    .legend span { display:inline-flex; align-items:center; gap:6px; }
    .legend i { width:10px; height:10px; border-radius:50%; }
    #imageDialog { width:min(920px,calc(100% - 28px)); max-height:calc(100vh - 28px); padding:0; border:0; border-radius:16px; color:var(--ink); background:var(--card); box-shadow:0 24px 80px rgba(20,15,10,.45); }
    #imageDialog::backdrop { background:rgba(26,22,18,.78); }
    .dialog-inner { position:relative; display:grid; gap:10px; padding:18px; }
    .dialog-close { position:absolute; z-index:2; top:10px; right:10px; width:44px; height:44px; border:1px solid var(--line); border-radius:50%; color:var(--ink); background:rgba(255,250,240,.95); font-size:1.4rem; cursor:pointer; }
    .dialog-media { min-height:200px; display:grid; place-items:center; overflow:hidden; border-radius:10px; background:#e9dfcf; }
    .dialog-media img { display:block; max-width:100%; max-height:70vh; object-fit:contain; }
    .dialog-copy { display:grid; gap:5px; padding-right:45px; }
    .dialog-copy h2, .dialog-copy p { margin:0; }
    .dialog-copy p { color:var(--ink-soft); line-height:1.5; }
    .dialog-source { color:#765438; }
    @media (max-width:520px) {
      .page-header, .filter-toolbar { padding-left:12px; padding-right:12px; }
      .filter-toolbar > * { max-width:100%; }
      .filter-label:has(#searchInput) { width:100%; }
      #searchInput { width:100%; }
      .art-workspace { width:calc(100% - 24px); height:auto; min-height:0; grid-template-columns:1fr; grid-template-rows:auto auto; }
      .map-panel { display:grid; grid-template-rows:minmax(330px,55vh) auto; overflow:visible; }
      .map-svg { grid-row:1; min-height:330px; }
      .map-panel.has-compact-list { grid-template-rows:minmax(330px,55vh) auto; overflow:visible; }
      .detail-panel { max-height:360px; border-left:0; border-top:1px solid var(--line); }
    }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { scroll-behavior:auto!important; transition-duration:.01ms!important; animation-duration:.01ms!important; animation-iteration-count:1!important; } }
  </style>
</head>

    <p class="subtitle">从地点出发，连接作品、文明与历史语境。</p>

  <script>
    const ARTWORKS = JSON.parse(document.getElementById('artwork-data').textContent);
    const IMAGE_CREDITS = JSON.parse(document.getElementById('image-credit-data').textContent);
    const state = {
      civilization: 'all',
      period: '',
      workType: '',
      search: '',
      selectedId: null,
      selectedSiteIndex: 0,
      expandedSiteToken: null,
      activeDetailTab: 'quick',
      transform: { x: 0, y: 0, scale: 1 }
    };
    const SITE_WORLD_COORDINATES = {
      'Amarna (Akhetaten)': { x: 958, y: 372 },
      'Anavysos, Attica': { x: 927, y: 309 },
      'Athens': { x: 926, y: 304 },
      'Deir el-Bahri, Thebes': { x: 954, y: 399 },
      'Giza': { x: 949, y: 348 },
      'Hierakonpolis (Nekhen)': { x: 957, y: 408 },
      'Karnak, Thebes (Luxor)': { x: 956, y: 397 },
      'Orvieto, Italy': { x: 867, y: 288 },
      'Pergamon (Bergama)': { x: 965, y: 294 },
      'Pompeii': { x: 879, y: 310 },
      'Rome': { x: 875, y: 296 },
      'Samothrace': { x: 946, y: 282 },
      'Saqqara': { x: 950, y: 353 },
      'Thebes': { x: 956, y: 396 },
      'Valley of the Kings, Thebes': { x: 953, y: 401 }
    };

    function toWorldCoordinates(workOrGroup) {
      const projected = SITE_WORLD_COORDINATES[workOrGroup.siteName];
      if (projected) return { ...projected };
      return {
        x: Math.max(0, Math.min(1600, 807 + workOrGroup.x * 0.28)),
        y: Math.max(0, Math.min(800, 230 + workOrGroup.y * 0.3))
      };
    }

    function normalize(value) {
      return String(value ?? '').normalize('NFKC').trim().toLowerCase();
    }

    function filterWorks(works, filters) {
      const query = normalize(filters.search);
      return works.filter((work) => {
        if (filters.civilization && filters.civilization !== 'all' && work.civilization !== filters.civilization) return false;
        if (filters.period && work.period !== filters.period) return false;
        if (filters.workType && work.workType !== filters.workType) return false;
        if (!query) return true;
        const searchable = [work.titleEn, work.titleZh, work.siteName, ...(work.keywords || [])]
          .map(normalize).join(' ');
        return searchable.includes(query);
      });
    }

    function compactApNumbers(numbers) {
      const sorted = [...new Set(numbers)].sort((a, b) => a - b);
      const ranges = [];
      let start = sorted[0];
      let previous = sorted[0];
      sorted.slice(1).forEach((value) => {
        if (value === previous + 1) {
          previous = value;
          return;
        }
        ranges.push(start === previous ? `${start}` : `${start}–${previous}`);
        start = value;
        previous = value;
      });
      if (start !== undefined) {
        ranges.push(start === previous ? `${start}` : `${start}–${previous}`);
      }
      return ranges.join(', ');
    }

    function formatApGroupLabel(works) {
      return `AP ${compactApNumbers(works.map((work) => work.apNumber))}`;
    }

    function createSiteToken(works) {
      const ids = works.map((work) => String(work.id)).sort().join('__');
      const safeIds = ids.replace(
        /[^a-zA-Z0-9_-]/g,
        (character) => `_${character.codePointAt(0).toString(16)}_`
      );
      return `site-${safeIds}`;
    }

    function groupBySite(works) {
      const groups = new Map();
      works.forEach((work) => {
        const key = `${work.siteName}\u0000${work.coordinates.x}\u0000${work.coordinates.y}`;
        if (!groups.has(key)) {
          groups.set(key, {
            key,
            siteName: work.siteName,
            x: work.coordinates.x,
            y: work.coordinates.y,
            civilization: work.civilization,
            works: []
          });
        }
        groups.get(key).works.push(work);
      });
      return [...groups.values()]
        .map((group) => {
          const sortedWorks = group.works.slice().sort((a, b) => a.id.localeCompare(b.id));
          const civilizations = [...new Set(sortedWorks.map((work) => work.civilization))].sort();
          const apGroupLabel = formatApGroupLabel(sortedWorks);
          return {
            ...group,
            civilization: civilizations.length === 1 ? civilizations[0] : 'mixed',
            civilizations,
            works: sortedWorks,
            siteToken: createSiteToken([{ id:group.key }]),
            apLabel: apGroupLabel.slice(3),
            apGroupLabel
          };
        })
        .sort((a, b) => a.siteName.localeCompare(b.siteName) || a.x - b.x || a.y - b.y);
    }

    function getMapScreenScale(width, height, zoomScale = 1) {
      const renderedScale = Math.min(width / 1600, height / 800);
      const visibleScale = Number.isFinite(renderedScale) && renderedScale > 0
        ? renderedScale
        : 0.23;
      return visibleScale * zoomScale;
    }

    function getMarkerMetrics(apLabel, isSingle, screenScale) {
      const scale = Math.max(0.05, screenScale);
      const fontSize = 12 / scale;
      const visualHeight = 30 / scale;
      const visualWidthPx = isSingle
        ? 30
        : Math.max(44, Math.min(120, apLabel.length * 7.2 + 18));
      const visualWidth = visualWidthPx / scale;
      return {
        fontSize,
        visualWidth,
        visualHeight,
        cornerRadius: visualHeight / 2,
        hitWidth: Math.max(44 / scale, visualWidth * 1.12),
        hitHeight: Math.max(44 / scale, visualHeight * 1.12)
      };
    }

    function getExpandedPinMetrics(screenScale) {
      const scale = Math.max(0.05, screenScale);
      return {
        fontSize: 12 / scale,
        visualDiameter: 30 / scale,
        hitWidth: 44 / scale,
        hitHeight: 44 / scale
      };
    }

    function expandedPinPositions(group, center, screenScale = 0.5, obstacleBounds = []) {
      const metrics = getExpandedPinMetrics(screenScale);
      const count = group.works.length;
      if (!count) return [];
      const minimumRadius = metrics.hitWidth + 6 / Math.max(0.05, screenScale);
      const positionsFit = (positions) => positions.every((position, index) => {
        if (
          position.bounds.left < 0 || position.bounds.right > 1600
          || position.bounds.top < 0 || position.bounds.bottom > 800
        ) return false;
        return obstacleBounds.every((bounds) => (
          !markerBoundsOverlap(position.bounds, bounds)
        )) && positions.slice(0, index).every((other) => (
          !markerBoundsOverlap(position.bounds, other.bounds)
        ));
      });
      const placeAtAngles = (angles, radius) => group.works.map((work, index) => {
        const x = center.x + Math.cos(angles[index]) * radius;
        const y = center.y + Math.sin(angles[index]) * radius;
        return { work, x, y, bounds: getMarkerBounds({ x, y }, metrics) };
      });
      const fullCircleRadius = count === 1
        ? minimumRadius
        : Math.max(minimumRadius, metrics.hitWidth / (2 * Math.sin(Math.PI / count)));
      for (let turn = 0; turn < 32; turn += 1) {
        const rotation = -Math.PI / 2 + turn * Math.PI / 16;
        const angles = group.works.map((work, index) => (
          rotation + Math.PI * 2 * index / count
        ));
        const positions = placeAtAngles(angles, fullCircleRadius);
        if (positionsFit(positions)) return positions;
      }
      const arcStep = count === 1 ? 0 : Math.PI / (count - 1);
      const arcRadius = count === 1
        ? minimumRadius
        : Math.max(minimumRadius, metrics.hitWidth / (2 * Math.sin(arcStep / 2)));
      for (const start of [0, Math.PI / 2, Math.PI, -Math.PI / 2]) {
        const angles = group.works.map((work, index) => start + arcStep * index);
        const positions = placeAtAngles(angles, arcRadius);
        if (positionsFit(positions)) return positions;
      }
      for (const direction of [1, -1]) {
        for (let columnCount = count; columnCount >= 1; columnCount -= 1) {
          let positions = group.works.map((work, index) => {
            const row = Math.floor(index / columnCount);
            const columnsInRow = Math.min(columnCount, count - row * columnCount);
            const column = index % columnCount;
            const x = center.x + (column - (columnsInRow - 1) / 2) * metrics.hitWidth;
            const y = center.y + direction * (row + 1) * metrics.hitHeight;
            return { work, x, y, bounds: getMarkerBounds({ x, y }, metrics) };
          });
          const outerBounds = positions.reduce((bounds, position) => ({
            left: Math.min(bounds.left, position.bounds.left),
            right: Math.max(bounds.right, position.bounds.right),
            top: Math.min(bounds.top, position.bounds.top),
            bottom: Math.max(bounds.bottom, position.bounds.bottom)
          }), { left:Infinity, right:-Infinity, top:Infinity, bottom:-Infinity });
          const shiftX = outerBounds.left < 0
            ? -outerBounds.left
            : Math.min(0, 1600 - outerBounds.right);
          const shiftY = outerBounds.top < 0
            ? -outerBounds.top
            : Math.min(0, 800 - outerBounds.bottom);
          positions = positions.map((position) => {
            const x = position.x + shiftX;
            const y = position.y + shiftY;
            return { ...position, x, y, bounds: getMarkerBounds({ x, y }, metrics) };
          });
          if (positionsFit(positions)) return positions;
        }
      }
      const columnLimit = Math.ceil(1600 / metrics.hitWidth);
      const rowLimit = Math.ceil(800 / metrics.hitHeight);
      const candidates = [];
      for (let row = -rowLimit; row <= rowLimit; row += 1) {
        for (let column = -columnLimit; column <= columnLimit; column += 1) {
          if (row === 0 && column === 0) continue;
          const x = center.x + column * metrics.hitWidth;
          const y = center.y + row * metrics.hitHeight;
          const bounds = getMarkerBounds({ x, y }, metrics);
          if (
            bounds.left < 0 || bounds.right > 1600
            || bounds.top < 0 || bounds.bottom > 800
          ) continue;
          candidates.push({
            x,
            y,
            bounds,
            distance: column ** 2 + row ** 2,
            angle: Math.atan2(row, column)
          });
        }
      }
      candidates.sort((first, second) => (
        first.distance - second.distance
        || first.angle - second.angle
        || first.y - second.y
        || first.x - second.x
      ));
      const spiderPositions = [];
      for (const work of group.works) {
        const candidate = candidates.find((position) => (
          obstacleBounds.every((bounds) => !markerBoundsOverlap(position.bounds, bounds))
          && spiderPositions.every((other) => (
            !markerBoundsOverlap(position.bounds, other.bounds)
          ))
        ));
        if (!candidate) break;
        spiderPositions.push({
          work,
          x: candidate.x,
          y: candidate.y,
          bounds: candidate.bounds
        });
      }
      if (spiderPositions.length === count) return spiderPositions;
      throw new Error('Unable to place expanded AP pins inside the map');
    }

    function getMarkerBounds(center, metrics) {
      return {
        left: center.x - metrics.hitWidth / 2,
        right: center.x + metrics.hitWidth / 2,
        top: center.y - metrics.hitHeight / 2,
        bottom: center.y + metrics.hitHeight / 2
      };
    }

    function markerBoundsOverlap(first, second) {
      return !(
        first.right <= second.left
        || first.left >= second.right
        || first.bottom <= second.top
        || first.top >= second.bottom
      );
    }

    function expandMarkerBounds(bounds, amount) {
      return {
        left: bounds.left - amount,
        right: bounds.right + amount,
        top: bounds.top - amount,
        bottom: bounds.bottom + amount
      };
    }

    function createSpatialHash(cellSize) {
      const cells = new Map();
      function visitCellKeys(bounds, visitor) {
        const firstColumn = Math.floor(bounds.left / cellSize);
        const lastColumn = Math.floor(bounds.right / cellSize);
        const firstRow = Math.floor(bounds.top / cellSize);
        const lastRow = Math.floor(bounds.bottom / cellSize);
        for (let column = firstColumn; column <= lastColumn; column += 1) {
          for (let row = firstRow; row <= lastRow; row += 1) {
            visitor(`${column}:${row}`);
          }
        }
      }
      return {
        insert(bounds, item) {
          visitCellKeys(bounds, (key) => {
            if (!cells.has(key)) cells.set(key, []);
            cells.get(key).push(item);
          });
        },
        query(bounds) {
          const matches = new Set();
          visitCellKeys(bounds, (key) => {
            (cells.get(key) || []).forEach((item) => matches.add(item));
          });
          return [...matches];
        }
      };
    }

    function findNearestAvailableMarkerSlot(anchor, metrics, screenScale, candidateFits) {
      const scale = Math.max(0.05, screenScale);
      const step = 3 / scale;
      const minimumX = metrics.hitWidth / 2;
      const maximumX = 1600 - metrics.hitWidth / 2;
      const minimumY = metrics.hitHeight / 2;
      const maximumY = 800 - metrics.hitHeight / 2;
      const columnCount = Math.ceil((maximumX - minimumX) / step);
      const rowCount = Math.ceil((maximumY - minimumY) / step);
      let nearest = null;
      let nearestDistance = Infinity;
      for (let row = 0; row <= rowCount; row += 1) {
        const y = Math.min(maximumY, minimumY + row * step);
        for (let column = 0; column <= columnCount; column += 1) {
          const x = Math.min(maximumX, minimumX + column * step);
          const candidate = { x, y };
          if (!candidateFits(candidate)) continue;
          const distance = (x - anchor.x) ** 2 + (y - anchor.y) ** 2;
          if (distance < nearestDistance) {
            nearest = candidate;
            nearestDistance = distance;
          }
        }
      }
      return nearest;
    }

    function layoutSiteMarkers(groups, screenScale = 0.5, project = toWorldCoordinates) {
      const positioned = [];
      const scale = Math.max(0.05, screenScale);
      const gap = 6 / scale;
      const prepared = groups.map((group) => ({
        ...group,
        markerMetrics: getMarkerMetrics(
          group.apLabel,
          group.works.length === 1,
          scale
        )
      }));
      const largestCell = prepared.reduce(
        (largest, group) => Math.max(
          largest,
          group.markerMetrics.hitWidth,
          group.markerMetrics.hitHeight
        ),
        64
      );
      const spatialHash = createSpatialHash(largestCell + gap);
      prepared.forEach((group) => {
        const anchor = project(group);
        const metrics = group.markerMetrics;
        function candidateFits(candidate) {
          const bounds = getMarkerBounds(candidate, metrics);
          if (
            bounds.left < 0 || bounds.right > 1600
            || bounds.top < 0 || bounds.bottom > 800
          ) return false;
          const expandedBounds = expandMarkerBounds(bounds, gap);
          const nearby = spatialHash.query(expandedBounds);
          return !nearby.some((site) => (
            markerBoundsOverlap(expandedBounds, site.bounds)
          ));
        }
        let display = candidateFits(anchor) ? anchor : null;
        const gridStep = 6 / scale;
        const ringCount = Math.ceil(1600 / gridStep);
        for (let ring = 1; ring <= ringCount && !display; ring += 1) {
          for (let offset = -ring; offset <= ring; offset += 1) {
            const candidates = [
              { x:anchor.x + offset * gridStep, y:anchor.y - ring * gridStep },
              { x:anchor.x + offset * gridStep, y:anchor.y + ring * gridStep }
            ];
            display = candidates.find(candidateFits) || null;
            if (display) break;
          }
          for (let offset = -ring + 1; offset < ring && !display; offset += 1) {
            const candidates = [
              { x:anchor.x - ring * gridStep, y:anchor.y + offset * gridStep },
              { x:anchor.x + ring * gridStep, y:anchor.y + offset * gridStep }
            ];
            display = candidates.find(candidateFits) || null;
          }
        }
        if (!display) {
          display = findNearestAvailableMarkerSlot(
            anchor,
            metrics,
            scale,
            candidateFits
          );
        }
        if (!display) throw new Error(`Unable to place ${group.siteName} without a marker collision`);
        const positionedGroup = {
          ...group,
          anchorX: anchor.x,
          anchorY: anchor.y,
          displayX: display.x,
          displayY: display.y,
          markerMetrics: metrics,
          bounds: getMarkerBounds(display, metrics)
        };
        positioned.push(positionedGroup);
        spatialHash.insert(positionedGroup.bounds, positionedGroup);
      });
      return positioned;
    }

    function assert(condition, message) {
      if (!condition) throw new Error(`Development assertion failed: ${message}`);
    }

    function clampTransform({ x, y, scale }) {
      const boundedScale = Math.min(3, Math.max(1, scale));
      const minimumX = 1600 * (1 - boundedScale);
      const minimumY = 800 * (1 - boundedScale);
      return {
        scale: boundedScale,
        x: Math.min(0, Math.max(minimumX, x)),
        y: Math.min(0, Math.max(minimumY, y))
      };
    }

    function cycleIndex(index, length, direction) {
      return length ? (index + direction + length) % length : 0;
    }

    function zoomAroundPoint(transform, nextScale, point = { x:800, y:400 }) {
      const boundedScale = Math.min(3, Math.max(1, nextScale));
      const contentX = (point.x - transform.x) / transform.scale;
      const contentY = (point.y - transform.y) / transform.scale;
      return clampTransform({
        scale: boundedScale,
        x: point.x - contentX * boundedScale,
        y: point.y - contentY * boundedScale
      });
    }

    function clientDeltaToViewBox(deltaX, deltaY, width, height) {
      const renderedScale = Math.min(width / 1600, height / 800);
      return { x: deltaX / renderedScale, y: deltaY / renderedScale };
    }

    function runDevelopmentAssertions() {
      const overZoomed = clampTransform({ x: 99999, y: 99999, scale: 9 });
      assert(overZoomed.scale === 3 && overZoomed.x === 0 && overZoomed.y === 0,
        'clampTransform() should cap zoom and keep the top-left world edge reachable');
      const farEdge = clampTransform({ x: -99999, y: -99999, scale: 3 });
      assert(farEdge.x === -3200 && farEdge.y === -1600,
        'clampTransform() should keep the right and bottom world edges reachable without blank space');
      const underZoomed = clampTransform({ x: 100, y: 100, scale: 0 });
      assert(underZoomed.scale === 1 && underZoomed.x === 0 && underZoomed.y === 0,
        'clampTransform() should return the 1× overview to its origin');
      assert(state.selectedSiteIndex === 0,
        'selection state should start at the first work at a site');
      assert(state.transform.scale === 1,
        'map navigation state should start at the overview scale');
      assert(cycleIndex(0, 3, -1) === 2 && cycleIndex(2, 3, 1) === 0,
        'site cycling should wrap in both directions');
      const centeredZoom = zoomAroundPoint({ x:0, y:0, scale:1 }, 2);
      assert(centeredZoom.x === -800 && centeredZoom.y === -400,
        'zoom should preserve the visible world center');
      const pannedZoom = zoomAroundPoint({ x:-400, y:-200, scale:2 }, 3);
      assert(pannedZoom.x === -1000 && pannedZoom.y === -500,
        'zoom should preserve the current center after panning');
      const letterboxedDelta = clientDeltaToViewBox(100, 100, 800, 800);
      assert(letterboxedDelta.x === 200 && letterboxedDelta.y === 200,
        'pointer deltas should use one meet scale when the SVG is letterboxed');
      const worldSvg = document.querySelector('.map-svg');
      assert(getComputedStyle(document.querySelector('.world-geography')).pointerEvents === 'none',
        'non-interactive geography should leave the background pan surface hittable');
      assert(document.getElementById('panSurface').nextElementSibling?.classList.contains('world-geography'),
        'the pan surface should sit behind geography and markers without covering them');
      assert(worldSvg.getAttribute('viewBox') === '0 0 1600 800',
        'art map should render the complete 1600 × 800 world overview');
      assert(worldSvg.querySelectorAll('.world-geography .region-path').length >= 100,
        'art map should reuse the detailed original-world geography');
      ARTWORKS.forEach((work) => {
        const projected = toWorldCoordinates({
          siteName: work.siteName,
          x: work.coordinates.x,
          y: work.coordinates.y
        });
        assert(projected.x >= 0 && projected.x <= 1600 && projected.y >= 0 && projected.y <= 800,
          `${work.id} should project inside the world map`);
      });
      const expectedCounts = { all: 27, egypt: 9, greece: 10, rome: 8 };
      Object.entries(expectedCounts).forEach(([civilization, expected]) => {
        const actual = filterWorks(ARTWORKS, {
          civilization,
          period: '',
          workType: '',
          search: ''
        }).length;
        assert(actual === expected, `Expected ${expected} ${civilization} works, received ${actual}`);
      });
      assert(normalize('  Ａthens  ') === 'athens', 'normalize() should apply NFKC, trim, and lowercase');
      assert(compactApNumbers([35, 39, 40]) === '35, 39–40',
        'compactApNumbers() should preserve gaps between AP ranges');
      assert(compactApNumbers([41, 42, 43, 44, 45, 46, 47]) === '41–47',
        'compactApNumbers() should merge consecutive AP numbers');
      const gizaGroups = groupBySite(ARTWORKS.filter((work) => work.siteName === 'Giza'));
      assert(gizaGroups.length === 1 && gizaGroups[0].works.length === 2,
        'groupBySite() should deterministically combine an exact site');
      [getMapScreenScale(362, 330), 0.5].forEach((screenScale) => {
        const laidOutSites = layoutSiteMarkers(groupBySite(ARTWORKS), screenScale);
        laidOutSites.forEach((site, index) => {
          laidOutSites.slice(index + 1).forEach((other) => {
            assert(!markerBoundsOverlap(site.bounds, other.bounds),
              `${site.siteName} and ${other.siteName} marker bounds should not overlap`);
          });
        });
      });
      assert(/^[a-zA-Z0-9_-]+$/.test(createSiteToken([{ id:'rome\u0000forty one' }])),
        'createSiteToken() should be safe for attribute selectors');
    }

      state.transform = clampTransform(state.transform);

    function selectArtwork(workId, siteToken, restoreFocus = false) {
      state.selectedId = workId;
      state.selectedSiteIndex = 0;
      state.expandedSiteToken = siteToken;
      state.activeDetailTab = 'quick';
      render();
      if (restoreFocus) focusExpandedWorkPin(workId);

    function expandSiteGroup(group, restoreFocus = false) {
      if (group.works.length === 1) {
        selectArtwork(group.works[0].id, group.siteToken);
        if (restoreFocus) focusSiteMarker(group.siteToken);
        return;
      }
      state.expandedSiteToken = state.expandedSiteToken === group.siteToken ? null : group.siteToken;
      render();
      if (restoreFocus) focusSiteMarker(group.siteToken);
    }

    function cycleSite(group, direction) {
      state.selectedSiteIndex = cycleIndex(state.selectedSiteIndex, group.works.length, direction);
      state.selectedId = group.works[state.selectedSiteIndex].id;
      state.activeDetailTab = 'quick';
      render();
      const label = direction < 0 ? '上一件同地点作品' : '下一件同地点作品';
      detailPanel.querySelector(`[aria-label="${label}"]`)?.focus();

    function installImageFallback(image, work) {
      image.addEventListener('error', () => {
        const fallback = document.createElement('div');
        fallback.className = 'image-fallback';
        fallback.textContent = `${work.titleZh} · ${work.titleEn}`;
        image.replaceWith(fallback);
      }, { once:true });
    }

    function createStudyBlock(title, ...paragraphs) {
      const block = document.createElement('section');
      block.className = 'study-block';
      const heading = document.createElement('h3');
      heading.textContent = title;
      block.append(heading);
      paragraphs.filter(Boolean).forEach((value) => {
        const copy = document.createElement('p');
        copy.textContent = value;
        block.append(copy);
      });
      return block;
    }

    function createImageCredit(work) {
      const credit = IMAGE_CREDITS[work.id];
      const line = document.createElement('p');
      line.className = 'image-credit';
      line.append(document.createTextNode(`图片：${credit.creatorOrInstitution} · `));
      const license = document.createElement('a');
      license.href = credit.licenseUrl;
      license.target = '_blank';
      license.rel = 'noopener noreferrer';
      license.textContent = credit.licenseName;
      line.append(license);
      return line;
    }

    function summarizeComparisonField(value) {
      return String(value).split(/[，；。]/).map((part) => part.trim()).find(Boolean) || String(value);
    }

    function createComparisonAngle(work, comparison) {
      const exactLinks = [];
      if (work.civilization === comparison.civilization) exactLinks.push('同属一个文明传统');
      if (work.period === comparison.period) exactLinks.push(`同属 ${work.period}`);
      if (work.workType === comparison.workType) exactLinks.push(`同为 ${work.workType}`);
      if (work.medium === comparison.medium) exactLinks.push(`同用 ${work.medium}`);
      const connection = exactLinks.length
        ? exactLinks.join('、')
        : '两者分属不同类别，适合观察材料、用途与时代如何改变表现';
      return [
        `联系：${connection}。`,
        `形式：本作“${summarizeComparisonField(work.form)}”；对比“${summarizeComparisonField(comparison.form)}”。`,
        `功能：本作“${summarizeComparisonField(work.function)}”；对比“${summarizeComparisonField(comparison.function)}”。`,
        `语境：本作“${summarizeComparisonField(work.context)}”；对比“${summarizeComparisonField(comparison.context)}”。`
      ].join('');
    }

    function openImageDialog(work, trigger) {
      imageDialogTrigger = trigger;
      const image = document.createElement('img');
      image.id = 'dialogImage';
      image.src = work.imageUrl;
      image.alt = work.imageAlt;
      installImageFallback(image, work);
      document.getElementById('dialogMedia').replaceChildren(image);
      document.getElementById('dialogTitle').textContent = `${work.titleEn} · ${work.titleZh}`;
      document.getElementById('dialogCaption').textContent = work.imageAlt;
      const credit = IMAGE_CREDITS[work.id];
      document.getElementById('dialogCredit').textContent = `图片：${credit.creatorOrInstitution}`;
      const license = document.getElementById('dialogLicense');
      license.href = credit.licenseUrl;
      license.textContent = `许可：${credit.licenseName}`;
      const source = document.getElementById('dialogSource');
      source.href = work.imageSourceUrl;
      source.textContent = `来源页：${work.imageSourceName}（查看原始文件）`;
      imageDialog.showModal();
      document.getElementById('dialogClose').focus();
    }

    function focusSelectedArtworkHeading() {
      const heading = detailPanel.querySelector('[data-selected-artwork-title]');
      if (!heading) return;
      heading.focus({ preventScroll:true });
      if (document.activeElement !== heading) heading.focus();
    }

    function selectComparison(comparisonId) {
      const target = ARTWORKS.find((work) => work.id === comparisonId);
      if (!target) return;
      Object.assign(state, {
        civilization:'all',
        period:'',
        workType:'',
        search:'',
        selectedId:target.id,
        selectedSiteIndex:0,
        expandedSiteToken:null,
        activeDetailTab:'quick'
      });
      document.querySelectorAll('.filter-pill').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.civilization === 'all'));
      });
      document.getElementById('periodFilter').value = '';
      document.getElementById('typeFilter').value = '';
      document.getElementById('searchInput').value = '';
      render();
      focusSelectedArtworkHeading();
      detailPanel.scrollTo({ top:0, behavior:'smooth' });
    }

    function renderArtworkDetails(work, group) {
      const summary = document.createElement('section');
      summary.className = 'selected-summary';
      const heading = document.createElement('h2');
      heading.className = 'work-title-en';
      heading.tabIndex = -1;
      heading.dataset.selectedArtworkTitle = '';
      heading.textContent = work.titleEn;
      const chineseTitle = document.createElement('p');
      chineseTitle.className = 'work-title-zh';
      chineseTitle.textContent = work.titleZh;
      const meta = document.createElement('p');
      meta.className = 'work-meta';
      const civilizations = { egypt:'埃及', greece:'希腊', rome:'罗马' };
      meta.textContent = `AP #${work.apNumber} · ${civilizations[work.civilization]} · ${work.period}`;

      const imageButton = document.createElement('button');
      imageButton.type = 'button';
      imageButton.className = 'artwork-image-button';

      const identity = document.createElement('dl');

      [

        ['艺术家／文化', work.artistCulture],

        ['功能', work.function]
      ].forEach(([label, value]) => {

        previous.addEventListener('click', () => cycleSite(group, -1));
        const position = document.createElement('span');
        position.textContent = `${state.selectedSiteIndex + 1} / ${group.works.length}`;
        const next = document.createElement('button');
        next.type = 'button';
        next.setAttribute('aria-label', '下一件同地点作品');
        next.textContent = '→';
        next.addEventListener('click', () => cycleSite(group, 1));
        cycle.append(previous, position, next);
        summary.append(cycle);
      }

      const tabs = [
        { id:'quick', label:'速览' },

      ];
      const tablist = document.createElement('div');

      const panel = document.createElement('section');
      panel.id = 'detail-tabpanel';
      panel.className = 'detail-tabpanel';
      panel.setAttribute('role', 'tabpanel');
      panel.tabIndex = 0;

      function activateTab(tabId, focus = false) {
        state.activeDetailTab = tabId;
        tablist.querySelectorAll('[role="tab"]').forEach((button) => {
          const active = button.dataset.tab === tabId;
          button.setAttribute('aria-selected', String(active));
          button.tabIndex = active ? 0 : -1;
          if (active) panel.setAttribute('aria-labelledby', button.id);
        });
        panel.replaceChildren();
        if (tabId === 'quick') {

            item.textContent = anchor;
            list.append(item);
          });
          anchors.append(list);
          panel.append(anchors);

          panel.append(createStudyBlock('形式', work.form), createStudyBlock('内容', work.content));

            title.textContent = `${comparison.titleZh} · ${comparison.titleEn}`;

            details.textContent = `AP #${comparison.apNumber} · ${comparison.period}`;
            const angle = document.createElement('span');
            angle.className = 'comparison-angle';

            card.append(title, details, angle);

            grid.append(card);
          });
          panel.append(grid.children.length ? grid : createStudyBlock('暂无比较作品', '此作品暂未关联比较对象。'));

        const button = document.createElement('button');
        button.type = 'button';

        button.setAttribute('aria-controls', 'detail-tabpanel');

        button.addEventListener('click', () => activateTab(id));
        button.addEventListener('keydown', (event) => {
          const current = tabs.findIndex((tab) => tab.id === state.activeDetailTab);
          let next = current;
          if (event.key === 'ArrowRight') next = (current + 1) % tabs.length;
          else if (event.key === 'ArrowLeft') next = (current - 1 + tabs.length) % tabs.length;
          else if (event.key === 'Home') next = 0;
          else if (event.key === 'End') next = tabs.length - 1;
          else return;
          event.preventDefault();
          activateTab(tabs[next].id, true);
        });
        tablist.append(button);
      });
      summary.append(tablist, panel);
      activateTab(tabs.some((tab) => tab.id === state.activeDetailTab) ? state.activeDetailTab : 'quick');

      const leaders = [];

        group,
        center,
        screenScale,
        obstacleBounds
      ).forEach(({ work, x, y }) => {

        pin.dataset.workId = work.id;
        pin.dataset.siteToken = group.siteToken;

        pin.setAttribute('transform', `translate(${x} ${y})`);

        pin.setAttribute('tabindex', '0');

          'aria-label',
          `AP ${work.apNumber} · ${work.titleEn} · ${group.siteName}`

        pin.addEventListener('click', () => selectArtwork(work.id, group.siteToken));
        pin.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          selectArtwork(work.id, group.siteToken, true);

        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = `AP ${work.apNumber} · ${work.titleEn} · ${group.siteName}`;
        const hitArea = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        hitArea.classList.add('expanded-pin-hit-area');
        hitArea.setAttribute('r', String(metrics.hitWidth / 2));
        const visual = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        visual.classList.add('expanded-pin-visual');
        const background = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        background.classList.add('expanded-pin-bg');
        background.setAttribute('r', String(metrics.visualDiameter / 2));
        background.setAttribute('vector-effect', 'non-scaling-stroke');
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.classList.add('expanded-pin-label');
        label.setAttribute('font-size', String(metrics.fontSize));
        label.textContent = String(work.apNumber);
        visual.append(background, label);
        pin.append(title, hitArea, visual);
        pins.push(pin);
      });
      return { leaders, pins };
    }

    function render() {
      const focusedSiteToken = document.activeElement?.classList?.contains('site-marker')
        ? document.activeElement.dataset.siteToken
        : null;
      const focusedWorkId = document.activeElement?.dataset?.workId || null;
      const visibleWorks = filterWorks(ARTWORKS, state);
      if (state.selectedId && !visibleWorks.some((work) => work.id === state.selectedId)) {
        state.selectedId = null;
        state.selectedSiteIndex = 0;
      }
      const leaders = [];
      const markers = [];
      const renderedMarkerScale = getRenderedMarkerScale();
      const visibleGroups = layoutSiteMarkers(
        groupBySite(visibleWorks),
        renderedMarkerScale
      );
      if (
        state.expandedSiteToken
        && !visibleGroups.some((group) => (
          group.siteToken === state.expandedSiteToken && group.works.length > 1
        ))
      ) {
        state.expandedSiteToken = null;
      }
      visibleGroups.forEach((group) => {
        if (Math.hypot(group.displayX - group.anchorX, group.displayY - group.anchorY) > 1) {
          const leader = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          leader.classList.add('marker-leader');
          leader.setAttribute('x1', group.anchorX);
          leader.setAttribute('y1', group.anchorY);
          leader.setAttribute('x2', group.displayX);
          leader.setAttribute('y2', group.displayY);
          leaders.push(leader);
        }
        const marker = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        marker.classList.add('site-marker');
        marker.dataset.siteToken = group.siteToken;
        marker.dataset.civilization = group.civilization;
        marker.setAttribute('transform', `translate(${group.displayX} ${group.displayY})`);
        marker.setAttribute('role', 'button');
        marker.setAttribute('tabindex', '0');
        marker.setAttribute('aria-pressed', String(group.works.some((work) => work.id === state.selectedId)));
        if (group.works.length > 1) {
          marker.setAttribute('aria-expanded', String(state.expandedSiteToken === group.siteToken));
        }
        if (
          group.works.some((work) => work.id === state.selectedId)
          || state.expandedSiteToken === group.siteToken
        ) marker.classList.add('is-active');
        marker.setAttribute('aria-label', `${group.siteName}；${group.apGroupLabel}`);
        marker.addEventListener('click', () => expandSiteGroup(group));
        marker.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          expandSiteGroup(group, true);
        });
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = `${group.siteName} · ${group.apGroupLabel}`;
        const metrics = group.markerMetrics;
        const hitArea = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        hitArea.classList.add('marker-hit-area');
        hitArea.setAttribute('x', String(-metrics.hitWidth / 2));
        hitArea.setAttribute('y', String(-metrics.hitHeight / 2));
        hitArea.setAttribute('width', String(metrics.hitWidth));
        hitArea.setAttribute('height', String(metrics.hitHeight));
        hitArea.setAttribute('rx', String(metrics.hitHeight / 2));
        const visual = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        visual.classList.add('marker-visual');
        const background = document.createElementNS(
          'http://www.w3.org/2000/svg',
          group.works.length === 1 ? 'circle' : 'rect'
        );
        background.classList.add('marker-label-bg');
        if (group.works.length === 1) {
          background.setAttribute('r', String(metrics.visualWidth / 2));
        } else {
          background.setAttribute('x', String(-metrics.visualWidth / 2));
          background.setAttribute('y', String(-metrics.visualHeight / 2));
          background.setAttribute('width', String(metrics.visualWidth));
          background.setAttribute('height', String(metrics.visualHeight));
          background.setAttribute('rx', String(metrics.cornerRadius));
        }
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.classList.add('marker-ap-label');
        label.setAttribute('font-size', String(metrics.fontSize));
        label.textContent = group.apLabel;
        visual.append(background, label);
        marker.append(title, hitArea, visual);
        markers.push(marker);
      });
      const expandedGroup = visibleGroups.find((group) => (
        group.works.length > 1 && group.siteToken === state.expandedSiteToken
      ));
      expandedPinList.hidden = true;
      expandedPinList.classList.remove('is-visible');
      mapPanel.classList.remove('has-compact-list');
      expandedPinList.replaceChildren();
      if (expandedGroup) {
        const expandedCenter = { x: expandedGroup.displayX, y: expandedGroup.displayY };
        const obstacleBounds = visibleGroups.map((group) => group.bounds);
        if (shouldUseCompactExpandedList(
          expandedGroup,
          expandedCenter,
          renderedMarkerScale,
          obstacleBounds
        )) {
          renderCompactExpandedList(expandedGroup);
        } else {
          const expanded = renderExpandedWorkPins(
            expandedGroup,
            expandedCenter,
            renderedMarkerScale,
            obstacleBounds
          );
          leaders.push(...expanded.leaders);
          markers.push(...expanded.pins);
        }
      }
      markerLayer.replaceChildren(...leaders, ...markers);
      if (focusedWorkId) focusExpandedWorkPin(focusedWorkId);
      else if (focusedSiteToken) focusSiteMarker(focusedSiteToken);

      detailPanel.replaceChildren();
      const count = document.createElement('p');
      count.className = 'result-count';
      count.textContent = `当前显示 ${visibleWorks.length} 件作品`;
      detailPanel.append(count);
      if (!visibleWorks.length) {
        const empty = document.createElement('section');
        empty.className = 'empty-state';
        const heading = document.createElement('h2');
        heading.textContent = '没有找到匹配作品';
        const copy = document.createElement('p');
        copy.textContent = '试试更换文明、时期、类型，或使用其他关键词。';
        const clear = document.createElement('button');
        clear.type = 'button';
        clear.className = 'clear-button';
        clear.textContent = '清除筛选';
        clear.addEventListener('click', clearFilters);
        empty.append(heading, copy, clear);
        detailPanel.append(empty);
      } else if (state.selectedId) {
        const selected = visibleWorks.find((work) => work.id === state.selectedId);
        const selectedGroup = visibleGroups.find((group) => group.works.some((work) => work.id === state.selectedId));
        state.selectedSiteIndex = Math.max(0, selectedGroup.works.findIndex((work) => work.id === state.selectedId));
        detailPanel.append(renderArtworkDetails(selected, selectedGroup));
      } else {
        const instruction = document.createElement('section');
        instruction.className = 'instruction';
        instruction.setAttribute('aria-label', '地图使用说明');
        const heading = document.createElement('h2');
        heading.textContent = '选择地图标记';
        const copy = document.createElement('p');
        copy.textContent = '点击 AP 编号标记，或用 Tab 聚焦后按 Enter / 空格。多件作品地点会展开为可单独选择的 AP 编号针。';
        const legend = document.createElement('div');
        legend.className = 'legend';
        [['埃及','#b85d44'],['希腊','#597f8b'],['罗马','#c8943d']].forEach(([label, color]) => {
          const item = document.createElement('span');
          const swatch = document.createElement('i');
          swatch.style.background = color;
          item.append(swatch, document.createTextNode(label));
          legend.append(item);
        });
        instruction.append(heading, copy, legend);
        detailPanel.append(instruction);
      }
    }

    function clearFilters() {
      Object.assign(state, {
        civilization:'all',
        period:'',
        workType:'',
        search:'',
        selectedId:null,
        selectedSiteIndex:0,
        expandedSiteToken:null,
        activeDetailTab:'quick',
        transform:{ x:0, y:0, scale:1 }
      });
      document.querySelectorAll('.filter-pill').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.civilization === 'all'));
      });
      document.getElementById('periodFilter').value = '';
      document.getElementById('typeFilter').value = '';
      document.getElementById('searchInput').value = '';
      render();
      applyTransform();
    }

    populateSelect(document.getElementById('periodFilter'), ARTWORKS.map((work) => work.period));
    populateSelect(document.getElementById('typeFilter'), ARTWORKS.map((work) => work.workType));
    document.querySelectorAll('.filter-pill').forEach((button) => button.addEventListener('click', () => {
      state.civilization = button.dataset.civilization;
      document.querySelectorAll('.filter-pill').forEach((pill) => pill.setAttribute('aria-pressed', String(pill === button)));
      render();
    }));
    document.getElementById('periodFilter').addEventListener('change', (event) => { state.period = event.target.value; render(); });
    document.getElementById('typeFilter').addEventListener('change', (event) => { state.workType = event.target.value; render(); });
    document.getElementById('searchInput').addEventListener('input', (event) => { state.search = event.target.value; render(); });
    document.getElementById('zoomIn').addEventListener('click', () => {
      state.transform = zoomAroundPoint(state.transform, state.transform.scale + .5);
      render();
      applyTransform();
    });
    document.getElementById('zoomOut').addEventListener('click', () => {
      state.transform = zoomAroundPoint(state.transform, state.transform.scale - .5);
      render();
      applyTransform();
    });
    document.getElementById('resetView').addEventListener('click', () => {
      state.transform = { x:0, y:0, scale:1 };
      render();
      applyTransform();
    });
    window.addEventListener('resize', scheduleMarkerLayout);
    const markerResizeObserver = new ResizeObserver(scheduleMarkerLayout);
    markerResizeObserver.observe(mapPanel);

    const panSurface = document.getElementById('panSurface');
    let panStart = null;
    panSurface.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      if (event.cancelable) event.preventDefault();
      panSurface.setPointerCapture(event.pointerId);
      panStart = {
        pointerId: event.pointerId,
        clientX: event.clientX,
        clientY: event.clientY,
        x: state.transform.x,
        y: state.transform.y
      };
    });
    panSurface.addEventListener('pointermove', (event) => {
      if (!panStart || event.pointerId !== panStart.pointerId) return;
      if (event.cancelable) event.preventDefault();
      const bounds = document.querySelector('.map-svg').getBoundingClientRect();
      const delta = clientDeltaToViewBox(
        event.clientX - panStart.clientX,
        event.clientY - panStart.clientY,
        bounds.width,
        bounds.height
      );
      state.transform = clampTransform({
        ...state.transform,
        x: panStart.x + delta.x,
        y: panStart.y + delta.y
      });
      applyTransform();
    });
    const stopPan = (event) => {
      if (!panStart || event.pointerId !== panStart.pointerId) return;
      panStart = null;
      if (panSurface.hasPointerCapture(event.pointerId)) panSurface.releasePointerCapture(event.pointerId);
    };
    panSurface.addEventListener('pointerup', stopPan);
    panSurface.addEventListener('pointercancel', stopPan);
    panSurface.addEventListener('lostpointercapture', stopPan);

    document.getElementById('dialogClose').addEventListener('click', () => imageDialog.close());
    imageDialog.addEventListener('click', (event) => {
      if (event.target === imageDialog) imageDialog.close();
    });
    imageDialog.addEventListener('close', () => {
      imageDialogTrigger?.focus();
      imageDialogTrigger = null;
    });

    window.ArtHistoryMap = {
      normalize,
      filterWorks,
      compactApNumbers,
      formatApGroupLabel,
      createSiteToken,
      groupBySite,
      toWorldCoordinates,
      getMapScreenScale,
      getMarkerMetrics,
      getMarkerBounds,
      markerBoundsOverlap,
      expandMarkerBounds,
      createSpatialHash,
      findNearestAvailableMarkerSlot,
      layoutSiteMarkers,
      clampTransform,
      cycleIndex,
      zoomAroundPoint,
      clientDeltaToViewBox,
      installImageFallback,
      createImageCredit,
      createComparisonAngle,
      openImageDialog,
      selectComparison,
      focusSelectedArtworkHeading,
      applyTransform,
      render,
      clearFilters,
      state,
      ARTWORKS
    };
    runDevelopmentAssertions();
    render();
    applyTransform();
    assertRenderedMarkerSemantics();
  </script>
</body>
</html>
